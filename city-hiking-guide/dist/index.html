<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe4" />
  <title>北京徒步指南</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #f4efe4;
      color: #26302a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    [hidden] { display: none !important; }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="27" height="27">
            <path d="M3 26 L12 9 L18 20 L22 13 L29 26 Z" fill="#3f6b4f"></path>
            <path d="M9.5 14.5 L12 9 L14.5 14.5 Z" fill="#d8c6a4"></path>
            <circle cx="24" cy="8" r="3" fill="#c47b4a"></circle>
            <path d="M4 27h24" stroke="#26302a" stroke-width="1.4" stroke-linecap="round"></path>
          </svg>
        </span>
        <div>
          <p class="eyebrow">BEIJING HIKING GUIDE</p>
          <h1>北京徒步指南</h1>
        </div>
      </div>
      <p class="tagline">按难度找路线</p>
    </div>
  </header>

  <main class="app-main">
    <section id="list-view" aria-label="路线列表">
      <p class="intro">先看名称、难度和里程耗时，点开路线再看起点、亮点和提示。</p>

      <div class="trip-meta">
        <span class="trip-city">北京</span>
        <span>10 条路线</span>
        <span>最佳 4—6 月、9—10 月</span>
      </div>

      <div class="toolbar">
        <div id="group-chips" class="group-chips" role="group" aria-label="按难度筛选"></div>
      </div>

      <p id="route-count" class="route-count">0 条路线</p>
      <div id="route-list" class="route-list"></div>
      <p id="route-empty" class="empty-state" hidden>没有匹配的路线。试试切换难度。</p>

      <p id="disclaimer" class="disclaimer"></p>
    </section>

    <section id="route-detail" class="route-detail-view" aria-label="路线详情" hidden>
      <button id="detail-back" class="back-link" type="button">‹ 返回路线列表</button>
      <div class="detail-meta">
        <span id="detail-level" class="detail-level"></span>
        <span id="detail-stats" class="detail-stats"></span>
      </div>
      <h2 id="detail-name" class="detail-name"></h2>
      <p id="detail-summary" class="detail-summary"></p>
      <div id="detail-tags" class="detail-tags"></div>

      <div class="detail-block">
        <h3>起点</h3>
        <p id="detail-start"></p>
      </div>
      <div class="detail-block">
        <h3>路线亮点</h3>
        <ul id="detail-highlights" class="detail-highlights"></ul>
      </div>
      <div class="detail-block">
        <h3>提示</h3>
        <p id="detail-tips"></p>
      </div>

      <div class="share-block">
        <h3>分享这张路线卡</h3>
        <div id="share-actions" class="share-actions">
          <button id="save-card" class="share-btn" type="button">保存图片</button>
          <button id="share-card" class="share-btn" type="button">分享图片</button>
          <button id="post-note" class="share-btn" type="button">发布笔记</button>
        </div>
        <p id="share-status" class="share-status" role="status"></p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>北京徒步指南 · 出发前请确认开放与天气</p>
  </footer>

  <script src="./data.js"></script>
  <script src="./engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
