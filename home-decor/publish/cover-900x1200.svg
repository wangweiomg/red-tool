      <stop offset="0.55" stop-color="#f8f0e2"/>
      <stop offset="1" stop-color="#efe3d0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d79b"/>
      <stop offset="1" stop-color="#e3b160"/>
