  <text x="450" y="1010" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#8a7a68">6×6 一居室 · 12 件家具 · 即时等距预览</text>
  <text x="450" y="1080" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#b08a5a">一步步搭出理想家</text>
  <text x="450" y="1120" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#b6a68f">装修实验室 · 2.5D 原型</text>
