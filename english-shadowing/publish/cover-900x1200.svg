    <g stroke="#7a5510" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <line x1="424" y1="424" x2="476" y2="424"/>
      <line x1="424" y1="456" x2="476" y2="456"/>
      <line x1="424" y1="488" x2="476" y2="488"/>
      <line x1="424" y1="520" x2="476" y2="520"/>
    </g>
    <path d="M348 492a102 102 0 0 0 204 0" fill="none" stroke="#12a97a" stroke-width="16" stroke-linecap="round"/>
    <line x1="450" y1="594" x2="450" y2="650" stroke="#12a97a" stroke-width="16" stroke-linecap="round"/>
    <line x1="394" y1="654" x2="506" y2="654" stroke="#12a97a" stroke-width="16" stroke-linecap="round"/>
    <path d="M290 452a150 150 0 0 0 0 128" fill="none" stroke="#f2b01e" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M610 452a150 150 0 0 1 0 128" fill="none" stroke="#f2b01e" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
