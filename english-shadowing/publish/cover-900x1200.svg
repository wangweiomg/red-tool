    <text x="605" y="746" text-anchor="middle" font-size="24" font-weight="700" fill="#0b7a58">旅客</text>
  </g>

  <g font-family="Noto Sans CJK SC, sans-serif">
    <rect x="150" y="840" width="600" height="78" rx="39" fill="#ffffff" stroke="#d9ece4"/>
    <text x="450" y="889" text-anchor="middle" font-size="26" fill="#31564c">场景对话 · 背单词 · 本机录音回放</text>
