  <text x="450" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="72" font-weight="800" letter-spacing="2" fill="#103029">英语跟读实验室</text>
  <text x="450" y="262" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="28" fill="#5d7a74">听一遍示范 → 读一遍 → 听自己的录音</text>

  <rect x="120" y="330" width="660" height="470" rx="36" fill="#ffffff" stroke="#d9ece4" stroke-width="2"/>

  <g>
