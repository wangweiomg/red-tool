<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e7" />
  <title>头像壁纸工坊</title>
  <style>
    html, body { margin: 0; padding: 0; background: #f6f1e7; color: #3f352b; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    h1, h2, p { margin: 0; }
    [hidden] { display: none !important; }
    .app { min-height: 100vh; padding: 0 16px 24px; }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <rect x="3" y="3" width="18" height="18" rx="5" fill="#ffd166"></rect>
            <circle cx="12" cy="10" r="3.2" fill="#8a6a4b"></circle>
            <path d="M6.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" fill="#8a6a4b"></path>
          </svg>
        </span>
        <div>
          <p class="eyebrow">PHOTO STUDIO</p>
          <h1>头像壁纸工坊</h1>
        </div>
      </div>
      <span class="tag-chip">原型</span>
    </header>

    <p class="subtitle">一张照片，换个头像和壁纸。</p>

    <div class="sound-bar" aria-label="声音设置">
      <span class="sound-label">声音</span>
      <button class="sound-toggle is-on" id="toggle-sfx" type="button" role="switch" aria-checked="true">音效</button>
      <button class="sound-toggle" id="toggle-bgm" type="button" role="switch" aria-checked="false" title="贝多芬《致爱丽丝》改编">背景音乐</button>
    </div>

    <div class="mode-tabs" id="mode-tabs" role="tablist" aria-label="选择模式">
      <button class="mode-tab is-active" type="button" data-mode="avatar" role="tab" aria-selected="true">头像框</button>
      <button class="mode-tab" type="button" data-mode="wallpaper" role="tab" aria-selected="false">壁纸</button>
    </div>

    <div class="chips" id="template-chips" role="group" aria-label="选择模板"></div>

    <div class="stage avatar" id="stage">
      <canvas id="preview" width="800" height="800" aria-label="效果预览"></canvas>
    </div>

    <p class="hint" id="hint">选择一张照片，拖动调整位置；双指缩放暂未开放，用下方滑杆缩放。</p>

    <div class="zoom-row">
      <span>缩放</span>
      <input type="range" id="zoom" min="1" max="2" step="0.05" value="1" aria-label="照片缩放" />
      <button class="link-btn" type="button" id="reset">重置位置</button>
    </div>

    <div class="actions">
      <input type="file" id="photo-input" accept="image/*" hidden />
      <label class="btn btn-primary" for="photo-input" id="pick-label">选择照片</label>
      <button class="btn btn-ghost" type="button" id="save" disabled>保存图片</button>
      <button class="btn btn-ghost" type="button" id="share" disabled>分享图片</button>
      <button class="btn btn-ghost" type="button" id="post" disabled>发布笔记</button>
    </div>

    <p class="status" id="status" role="status">照片只在本机处理，不会上传。</p>

    <details class="rules">
      <summary>怎么用</summary>
      <ul>
        <li>选「头像框」或「壁纸」，再挑一个模板。</li>
        <li>选择照片后，在预览上拖动调整位置，用滑杆缩放。</li>
        <li>保存图片到相册，或直接分享、发布笔记。</li>
        <li>照片只在本机 Canvas 处理，不会上传到服务器。</li>
      </ul>
    </details>
  </main>
  <script defer src="./data.js"></script>
  <script defer src="./engine.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
