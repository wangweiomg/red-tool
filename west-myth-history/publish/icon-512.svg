<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f2e4"/>
      <stop offset="1" stop-color="#e8d9bf"/>
    </linearGradient>
    <linearGradient id="cn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ad4a37"/>
      <stop offset="1" stop-color="#8e3527"/>
    </linearGradient>
    <linearGradient id="west" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6d99"/>
      <stop offset="1" stop-color="#345176"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <circle cx="448" cy="72" r="120" fill="#dbe5f1" opacity="0.7"/>
    <circle cx="56" cy="466" r="126" fill="#ecd9b8" opacity="0.7"/>

    <!-- sun -->
    <circle cx="256" cy="88" r="22" fill="#c99a45"/>
    <circle cx="256" cy="88" r="10" fill="#f9f2e4"/>

    <!-- central timeline -->
    <rect x="252" y="112" width="8" height="304" rx="4" fill="#c99a45"/>
    <circle cx="256" cy="150" r="13" fill="#f9f2e4" stroke="#c99a45" stroke-width="6"/>
    <circle cx="256" cy="232" r="13" fill="#f9f2e4" stroke="#c99a45" stroke-width="6"/>
    <circle cx="256" cy="314" r="13" fill="#f9f2e4" stroke="#c99a45" stroke-width="6"/>
    <circle cx="256" cy="396" r="13" fill="#f9f2e4" stroke="#c99a45" stroke-width="6"/>

    <!-- red scroll -->
    <rect x="86" y="148" width="122" height="258" rx="16" fill="url(#cn)"/>
    <rect x="86" y="148" width="20" height="258" rx="10" fill="#782c20"/>
    <rect x="120" y="184" width="68" height="10" rx="5" fill="#f2d7cb"/>
    <rect x="120" y="206" width="50" height="8" rx="4" fill="#f2d7cb" opacity="0.85"/>
    <rect x="120" y="288" width="68" height="10" rx="5" fill="#f2d7cb"/>
    <rect x="120" y="310" width="50" height="8" rx="4" fill="#f2d7cb" opacity="0.85"/>

    <!-- blue scroll -->
    <rect x="304" y="148" width="122" height="258" rx="16" fill="url(#west)"/>
    <rect x="406" y="148" width="20" height="258" rx="10" fill="#2a4161"/>
    <rect x="324" y="184" width="68" height="10" rx="5" fill="#dbe5f1"/>
    <rect x="324" y="206" width="50" height="8" rx="4" fill="#dbe5f1" opacity="0.85"/>
    <rect x="324" y="288" width="68" height="10" rx="5" fill="#dbe5f1"/>
    <rect x="324" y="310" width="50" height="8" rx="4" fill="#dbe5f1" opacity="0.85"/>

    <ellipse cx="256" cy="432" rx="154" ry="14" fill="#d6c5a6" opacity="0.75"/>
  </g>
</svg>
