  <text x="450" y="908" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#7b88a1">每年级 4 题 · 答对 3 题晋级</text>

  <circle cx="150" cy="1000" r="34" fill="#ff6b6b"/><text x="150" y="1012" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="800" fill="#ffffff">1</text><circle cx="260" cy="1000" r="34" fill="#4f8ef7"/><text x="260" y="1012" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="800" fill="#ffffff">2</text><circle cx="370" cy="1000" r="34" fill="#2ec4b6"/><text x="370" y="1012" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="800" fill="#ffffff">3</text><circle cx="480" cy="1000" r="34" fill="#ffc53d"/><text x="480" y="1012" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="800" fill="#ffffff">4</text><circle cx="590" cy="1000" r="34" fill="#8b7cf6"/><text x="590" y="1012" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="800" fill="#ffffff">5</text><circle cx="700" cy="1000" r="34" fill="#22b573"/><text x="700" y="1012" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="800" fill="#ffffff">6</text>
  <text x="450" y="1080" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#7b88a1">你能达到几年级？</text>
  <text x="70" y="1148" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#9aa9c2">综合卷 · 语文 / 数学 / 英语 / 科学</text>
