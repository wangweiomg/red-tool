<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff2df"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9e4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8e9ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#d8e9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4a6aa0" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="820" cy="100" r="300" fill="url(#blue)"/>
  <circle cx="80" cy="1120" r="320" fill="url(#pink)"/>

  <rect x="70" y="70" width="74" height="74" rx="18" fill="url(#seal)"/>
  <text x="107" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="800" fill="#ffffff">小</text>
  <text x="168" y="128" font-family="Noto Sans CJK SC, sans-serif" font-size="58" font-weight="800" fill="#1f2c44">小学回忆杀</text>
  <text x="170" y="178" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#7b88a1">综合卷 · 科目和年级都由你选</text>

  <rect x="680" y="86" width="150" height="58" rx="29" fill="#ff6b6b"/>
  <text x="755" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#ffffff">6 个年级</text>

  <rect x="162" y="218" width="104" height="52" rx="26" fill="#eef4ff"/><text x="214" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#3a6fe0">综合</text><rect x="280" y="218" width="104" height="52" rx="26" fill="#fff1f1"/><text x="332" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#d64545">语文</text><rect x="398" y="218" width="104" height="52" rx="26" fill="#eef5ff"/><text x="450" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#3a6fe0">数学</text><rect x="516" y="218" width="104" height="52" rx="26" fill="#e8fbf8"/><text x="568" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#128f84">英语</text><rect x="634" y="218" width="104" height="52" rx="26" fill="#fff8e6"/><text x="686" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#b07b00">科学</text>

  <rect x="90" y="300" width="720" height="640" rx="30" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="130" y="342" width="110" height="42" rx="21" fill="#fff1f1"/>
  <text x="185" y="370" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#d64545">语文</text>
  <text x="770" y="370" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#7b88a1">一年级</text>
