<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f3e6"/>
      <stop offset="1" stop-color="#eadcc3"/>
    </linearGradient>
    <linearGradient id="cn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b34b35"/>
      <stop offset="1" stop-color="#943828"/>
    </linearGradient>
    <linearGradient id="west" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6d99"/>
      <stop offset="1" stop-color="#355176"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <circle cx="452" cy="70" r="120" fill="#dbe5f1" opacity="0.7"/>
    <circle cx="50" cy="468" r="126" fill="#ecd9b8" opacity="0.65"/>

    <!-- sun / origin -->
    <circle cx="256" cy="94" r="24" fill="#c99a45"/>
    <circle cx="256" cy="94" r="12" fill="#f9f3e6"/>

    <!-- central timeline -->
    <rect x="252" y="120" width="8" height="296" rx="4" fill="#c99a45"/>
    <circle cx="256" cy="158" r="13" fill="#f9f3e6" stroke="#c99a45" stroke-width="6"/>
    <circle cx="256" cy="238" r="13" fill="#f9f3e6" stroke="#c99a45" stroke-width="6"/>
    <circle cx="256" cy="318" r="13" fill="#f9f3e6" stroke="#c99a45" stroke-width="6"/>
    <circle cx="256" cy="398" r="13" fill="#f9f3e6" stroke="#c99a45" stroke-width="6"/>

    <!-- china book -->
    <rect x="88" y="150" width="120" height="250" rx="16" fill="url(#cn)"/>
    <rect x="88" y="150" width="20" height="250" rx="10" fill="#7f2e21"/>
    <rect x="122" y="184" width="66" height="10" rx="5" fill="#f2d7cb"/>
    <rect x="122" y="206" width="48" height="8" rx="4" fill="#f2d7cb" opacity="0.85"/>
    <rect x="122" y="286" width="66" height="10" rx="5" fill="#f2d7cb"/>
    <rect x="122" y="308" width="48" height="8" rx="4" fill="#f2d7cb" opacity="0.85"/>

    <!-- west book -->
    <rect x="304" y="150" width="120" height="250" rx="16" fill="url(#west)"/>
    <rect x="404" y="150" width="20" height="250" rx="10" fill="#2b4263"/>
    <rect x="324" y="184" width="66" height="10" rx="5" fill="#dbe5f1"/>
    <rect x="324" y="206" width="48" height="8" rx="4" fill="#dbe5f1" opacity="0.85"/>
    <rect x="324" y="286" width="66" height="10" rx="5" fill="#dbe5f1"/>
    <rect x="324" y="308" width="48" height="8" rx="4" fill="#dbe5f1" opacity="0.85"/>

    <ellipse cx="256" cy="432" rx="150" ry="14" fill="#d8c8aa" opacity="0.75"/>
  </g>
</svg>
