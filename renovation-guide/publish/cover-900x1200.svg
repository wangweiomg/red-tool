<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fdf9f0"/>
      <stop offset="0.55" stop-color="#f8f0e2"/>
      <stop offset="1" stop-color="#efe3d0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d79b"/>
      <stop offset="1" stop-color="#e3b160"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="780" cy="160" r="210" fill="#f0dfc2" opacity="0.55"/>
  <circle cx="110" cy="1040" r="230" fill="#dfe8db" opacity="0.5"/>

  <text x="450" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="600" letter-spacing="8" fill="#a08055">RENOVATION GUIDE</text>
  <text x="450" y="200" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="#3d352b">装修流程手册</text>
  <text x="450" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="30" fill="#8a7a68">从开工到入住，按阶段少踩坑</text>

  <g>
    <rect x="120" y="330" width="660" height="520" rx="32" fill="#ffffff" stroke="#e0d1b8" stroke-width="2"/>
    <rect x="120" y="330" width="660" height="76" rx="32" fill="#fbf4e6"/>
    <rect x="120" y="382" width="660" height="24" fill="#fbf4e6"/>
    <text x="158" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="800" fill="#3d352b">装修进度</text>
    <text x="742" y="380" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#a08055">已完成 6 / 10</text>

    <g font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#5b4a39">
      <circle cx="168" cy="452" r="16" fill="#6f9a76"/><path d="M160 452l5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="200" y="460">开工准备</text><text x="720" y="460" text-anchor="end" fill="#a08d76">1–3 周</text>
      <circle cx="168" cy="512" r="16" fill="#6f9a76"/><path d="M160 512l5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="200" y="520">拆改</text><text x="720" y="520" text-anchor="end" fill="#a08d76">3–7 天</text>
      <circle cx="168" cy="572" r="16" fill="#6f9a76"/><path d="M160 572l5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="200" y="580">水电改造</text><text x="720" y="580" text-anchor="end" fill="#a08d76">7–14 天</text>
      <circle cx="168" cy="632" r="16" fill="#6f9a76"/><path d="M160 632l5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="200" y="640">防水</text><text x="720" y="640" text-anchor="end" fill="#a08d76">2–4 天</text>
      <circle cx="168" cy="692" r="16" fill="#6f9a76"/><path d="M160 692l5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="200" y="700">泥瓦</text><text x="720" y="700" text-anchor="end" fill="#a08d76">7–15 天</text>
      <circle cx="168" cy="752" r="16" fill="#e0a94b"/><text x="168" y="759" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">6</text><text x="200" y="760">木工 / 定制</text><text x="720" y="760" text-anchor="end" fill="#a08d76">7–20 天</text>
      <circle cx="168" cy="812" r="16" fill="#efe3d0" stroke="#d9c7ad" stroke-width="2"/><text x="200" y="820" fill="#a08d76">油漆</text><text x="720" y="820" text-anchor="end" fill="#b9a488">7–15 天</text>
    </g>
  </g>

  <g font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">
    <rect x="120" y="900" width="200" height="58" rx="29" fill="#f9ecd4" stroke="#d8bd91"/>
    <text x="220" y="937" text-anchor="middle" fill="#8a5a1c">10 个阶段</text>
    <rect x="340" y="900" width="200" height="58" rx="29" fill="#f9ecd4" stroke="#d8bd91"/>
    <text x="440" y="937" text-anchor="middle" fill="#8a5a1c">30 条材料</text>
    <rect x="560" y="900" width="220" height="58" rx="29" fill="#f9ecd4" stroke="#d8bd91"/>
    <text x="670" y="937" text-anchor="middle" fill="#8a5a1c">预算 · 自测</text>
  </g>

  <text x="450" y="1030" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#6f5d49">新房 / 老房改造 · 新一线参考价</text>
  <text x="450" y="1080" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#b08a5a">开工前先过一遍，少返工、少增项</text>
  <text x="450" y="1120" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#b6a68f">通用经验，施工以当地规范和专业人员确认为准</text>
</svg>
