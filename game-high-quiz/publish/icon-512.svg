<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f4ea"/>
      <stop offset="1" stop-color="#f0e8da"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43557f"/>
      <stop offset="1" stop-color="#33436a"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <circle cx="452" cy="72" r="128" fill="#dde7f3" opacity="0.75"/>
    <circle cx="52" cy="474" r="132" fill="#efe2c8" opacity="0.7"/>

    <!-- soft shadow under the stack -->
    <ellipse cx="256" cy="462" rx="168" ry="20" fill="#e2d7c2" opacity="0.75"/>

    <!-- graduation cap -->
    <path d="M256 106 L392 162 L256 218 L120 162 Z" fill="url(#capTop)"/>
    <path d="M256 106 L392 162 L256 218 Z" fill="#4b5f8d" opacity="0.55"/>
    <path d="M198 194 L198 236 C198 258 224 272 256 272 C288 272 314 258 314 236 L314 194
             L256 218 Z" fill="#2f3a4a"/>
    <circle cx="256" cy="140" r="7" fill="#d9a13f"/>
    <path d="M391 163 C398 190 399 214 396 238" fill="none" stroke="#d9a13f"
          stroke-width="7" stroke-linecap="round"/>
    <circle cx="396" cy="242" r="9" fill="#d9a13f"/>

    <!-- top book (gold) -->
    <rect x="100" y="248" width="312" height="66" rx="16" fill="#d9a13f"/>
    <rect x="100" y="248" width="26" height="66" rx="13" fill="#bf8b2e"/>
    <rect x="140" y="266" width="160" height="10" rx="5" fill="#f3dfb8"/>
    <rect x="140" y="286" width="112" height="10" rx="5" fill="#f3dfb8" opacity="0.85"/>

    <!-- middle book (green) -->
    <rect x="122" y="318" width="286" height="64" rx="16" fill="#3f7d5f"/>
    <rect x="122" y="318" width="26" height="64" rx="13" fill="#33684e"/>
    <rect x="162" y="336" width="150" height="10" rx="5" fill="#cfe3d9"/>
    <rect x="162" y="356" width="104" height="10" rx="5" fill="#cfe3d9" opacity="0.85"/>

    <!-- bottom book (blue) -->
    <rect x="96" y="386" width="320" height="68" rx="16" fill="#4a5aa8"/>
    <rect x="96" y="386" width="26" height="68" rx="13" fill="#3b4a90"/>
    <rect x="136" y="404" width="168" height="10" rx="5" fill="#dfe8f4"/>
    <rect x="136" y="424" width="118" height="10" rx="5" fill="#dfe8f4" opacity="0.85"/>

    <!-- achievement star badge -->
    <rect x="66" y="232" width="62" height="62" rx="18" fill="#ffffff"/>
    <path d="M97 246 L103.6 259.4 L118.4 261.6 L107.7 272 L110.2 286.8
             L97 280 L83.8 286.8 L86.3 272 L75.6 261.6 L90.4 259.4 Z" fill="#d9a13f"/>
  </g>
</svg>
