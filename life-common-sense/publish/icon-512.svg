<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset="1" stop-color="#ece2d0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3814c"/>
      <stop offset="1" stop-color="#984825"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <circle cx="448" cy="72" r="120" fill="#f6ddc4" opacity="0.75"/>
    <circle cx="56" cy="464" r="126" fill="#f0dfc4" opacity="0.7"/>

    <!-- card -->
    <rect x="96" y="104" width="320" height="300" rx="28" fill="url(#teal)"/>
    <rect x="96" y="104" width="320" height="300" rx="28" fill="#ffffff" opacity="0.04"/>
    <rect x="134" y="146" width="150" height="18" rx="9" fill="#fbe3d0"/>
    <rect x="134" y="182" width="104" height="14" rx="7" fill="#fbe3d0" opacity="0.8"/>
    <rect x="134" y="220" width="244" height="14" rx="7" fill="#fbe3d0" opacity="0.55"/>
    <rect x="134" y="248" width="196" height="14" rx="7" fill="#fbe3d0" opacity="0.55"/>

    <!-- check badge -->
    <circle cx="344" cy="330" r="54" fill="#fffaf0"/>
    <path d="M318 330l18 18 34-40" fill="none" stroke="#984825" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- category dots -->
    <circle cx="130" cy="430" r="11" fill="#c66a3a"/>
    <circle cx="173" cy="430" r="11" fill="#b85a72"/>
    <circle cx="216" cy="430" r="11" fill="#b5473c"/>
    <circle cx="259" cy="430" r="11" fill="#a97a3f"/>
    <circle cx="302" cy="430" r="11" fill="#7c7a45"/>
    <circle cx="345" cy="430" r="11" fill="#7a5a6e"/>
    <circle cx="388" cy="430" r="11" fill="#c08a3e"/>
  </g>
</svg>
