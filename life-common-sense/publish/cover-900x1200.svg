<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5ea"/>
      <stop offset="1" stop-color="#ece2d0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3814c"/>
      <stop offset="1" stop-color="#984825"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6ddc4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6ddc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0dfc4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0dfc4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="800" cy="150" r="250" fill="url(#glow)"/>
  <circle cx="80" cy="1110" r="270" fill="url(#warm)"/>

  <text x="450" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
