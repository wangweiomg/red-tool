  <!-- mini answer card -->
  <rect x="586" y="386" width="202" height="356" rx="18" fill="url(#accent)"/>
  <rect x="612" y="414" width="96" height="12" rx="6" fill="#fbe3d0"/>
  <rect x="612" y="438" width="70" height="9" rx="4" fill="#fbe3d0" opacity="0.8"/>
  <rect x="612" y="470" width="150" height="34" rx="8" fill="#fffaf3" opacity="0.18"/>
  <rect x="612" y="514" width="150" height="34" rx="8" fill="#fffaf3" opacity="0.32"/>
  <rect x="612" y="558" width="150" height="34" rx="8" fill="#fffaf3" opacity="0.18"/>
  <circle cx="687" cy="650" r="34" fill="#fffaf3"/>
  <path d="M671 650l11 11 21-25" fill="none" stroke="#984825" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chips -->
  <rect x="126" y="852" width="200" height="54" rx="27" fill="#ffffff"
        stroke="#e1d3b9" stroke-width="1.5"/>
  <text x="226" y="888" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" font-weight="700" fill="#984825">每组 10 题</text>

  <rect x="346" y="852" width="208" height="54" rx="27" fill="#ffffff"
        stroke="#e1d3b9" stroke-width="1.5"/>
  <text x="450" y="888" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" font-weight="700" fill="#b5473c">综合挑战 20 题</text>

  <rect x="574" y="852" width="200" height="54" rx="27" fill="#ffffff"
        stroke="#e1d3b9" stroke-width="1.5"/>
  <text x="674" y="888" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
        font-size="23" font-weight="700" fill="#7a5a6e">错题自动收集</text>

  <text x="450" y="982" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif"
